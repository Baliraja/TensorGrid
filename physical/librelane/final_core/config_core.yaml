meta:
  version: 3
  flow: Classic

STD_CELL_LIBRARY: gf180mcu_fd_sc_mcu7t5v0

DESIGN_NAME: A37_A

VERILOG_FILES:
- dir::src/command_parser.sv
- dir::src/integration_minus_UART.sv
- dir::src/integration_final.sv
- dir::src/A37_A.sv
- dir::src/int_MAC.sv
- dir::src/MAC_grid.sv
- dir::src/quantizer.sv
- dir::src/reg_bank.sv
- dir::src/uart_baud_gen.v
- dir::src/uart_rx.v
- dir::src/uartTopBaseExt.v
- dir::src/uart_tx.v

PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# A37_A.def supplies the physical IO/padframe geometry, including
# the VDD/VSS Metal2 power stubs used by the custom PDN bridge.
FP_DEF_TEMPLATE: dir::A37_def/project_defs/A/A37_A.def
FP_TEMPLATE_MATCH_MODE: permissive
FP_TEMPLATE_COPY_POWER_PINS: true # use power pins from template
PDN_ENABLE_PINS: false # DONT make the PDN straps as pins


# SDC files
PNR_SDC_FILE: dir::constraints_core.sdc
SIGNOFF_SDC_FILE: dir::constraints_core.sdc
FALLBACK_SDC: dir::constraints_core.sdc


FP_SIZING: absolute
DIE_AREA:  [0, 0, 1110, 1110]
CORE_AREA: [30, 30, 1080, 1080]


# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# The step-21 PSM grid check runs before Odb.ApplyDEFTemplate creates the VDD/VSS
# pins, so it reports a false-positive "does not contain any terminals". Step-58
# IRDropReport confirms every shape is connected (PSM-0040) and LVS passes.
# The deferred violation is therefore waived here rather than failing the flow.
ERROR_ON_PDN_VIOLATIONS: false

ERROR_ON_KLAYOUT_DENSITY: false


# Clock
CLOCK_PORT: i_clk
CLOCK_NET: i_clk
CLOCK_PERIOD: 100


# add 3v3 timing corners
DEFAULT_CORNER: nom_tt_025C_3v30
STA_CORNERS:
  - nom_tt_025C_3v30
  - min_ff_n40C_3v60
  - max_ss_125C_3v00

LIB:
  nom_tt_025C_3v30:
    - "/foss/pdks/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__tt_025C_3v30.lib"
  min_ff_n40C_3v60:
    - "/foss/pdks/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ff_n40C_3v60.lib"
  max_ss_125C_3v00:
    - "/foss/pdks/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ss_125C_3v00.lib"

# Yosys synthesis options
MAX_FANOUT_CONSTRAINT: 10
SYNTH_STRATEGY: "AREA 0"
SYNTH_SPLITNETS: true


# Optimize setup and hold timing
RUN_POST_CTS_RESIZER_TIMING: true
RUN_POST_GRT_RESIZER_TIMING: true

PL_RESIZER_SETUP_SLACK_MARGIN: 0.5
GRT_RESIZER_SETUP_SLACK_MARGIN: 0.5
PL_RESIZER_HOLD_SLACK_MARGIN: 0.3
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

PL_RESIZER_ALLOW_SETUP_VIOS: false
GRT_RESIZER_ALLOW_SETUP_VIOS: false


# Optimize slew and cap timing
RUN_POST_GRT_DESIGN_REPAIR: true
DESIGN_REPAIR_MAX_WIRE_LENGTH: 180
GRT_DESIGN_REPAIR_MAX_WIRE_LENGTH: 180

GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 35
GRT_DESIGN_REPAIR_MAX_CAP_PCT: 35

MAX_CAPACITANCE_CONSTRAINT: 0.1


# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10


# Max routing layer


GRT_ALLOW_CONGESTION: true
RT_MAX_LAYER: Metal5

RT_CLOCK_MIN_LAYER: Metal2
RT_CLOCK_MAX_LAYER: Metal3


# PDN - Straps
#
#
# Metal2 = vertical straps
# Metal3 = horizontal straps

PDN_VWIDTH: 5 #1.6
PDN_HWIDTH: 5 #1.6
PDN_VSPACING: 5
PDN_HSPACING: 7
PDN_VPITCH: 98 # integer multiple of std cell height
PDN_HPITCH: 98 # integer multiple of std cell height
PDN_VOFFSET: 53.56
PDN_HOFFSET: 40.82


# PDN - Ring

PDN_CORE_RING: True
PDN_CORE_RING_VOFFSET: 2
PDN_CORE_RING_HOFFSET: 2
PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_HORIZONTAL_LAYER: Metal3
PDN_CORE_RING_ALLOW_OUT_OF_DIE: False # force PDN ring inside die area

# A37_A.def contains physical VDD/VSS padframe stubs.
PDN_CORE_RING_CONNECT_TO_PADS: True


#
# pdn_core_cfg.tcl:
#
#   - establishes the CORE voltage domain
#   - creates the stdcell grid
#   - creates M2 vertical and M3 horizontal straps
#   - creates the M2/M3 core ring
#   - connects the standard-cell rails
#   - connects M2 to M3
#   - runs pdngen
#   - bridges the west-edge VDD/VSS template stubs to the
#     generated core ring after pdngen

PDN_CFG: dir::pdn_core_cfg.tcl

# ==============================================================
# MACRO HALOS
# ==============================================================

FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10


# ==============================================================
# SIGNOFF
# ==============================================================

RUN_LINTER: true
RUN_MAGIC_DRC: true
RUN_KLAYOUT_DRC: true
RUN_LVS: true

KLAYOUT_DRC_RUNSET: /foss/pdks/gf180mcuD/libs.tech/klayout/tech/drc/gf180mcu.drc

KLAYOUT_DRC_THREADS: 1

KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup"
  variant: ref::$PDK
  workers: max
